expose_php = Off
memory_limit = 512M
max_execution_time = 240
post_max_size = 10M
upload_max_filesize = 10M

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

